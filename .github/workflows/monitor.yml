name: Sit housing monitor

on:
  # Scheduled runs DISABLED 2026-08-24 — housing secured (Karinelund keeper +
  # Parkbygget bridge terminated to Sep 18) and BedEx spot confirmed, so both
  # watchers are retired. Re-enable by uncommenting the cron below.
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Allow the workflow to commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: sit-housing-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new housing
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CITY: ${{ vars.CITY || 'Trondheim' }}
        run: python check_sit_housing.py

      - name: Check Abakus BedEx registration timing
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_abakus.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "Update housing state [skip ci]"
            # The local 10-min runner may have pushed since checkout; rebase on
            # top of it before pushing so the two never clobber each other.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "No state change to commit."
          fi
