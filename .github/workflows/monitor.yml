name: Sit housing monitor

on:
  schedule:
    # Every 10 minutes. GitHub cron is UTC and can be delayed under load;
    # the minimum interval it honours is ~5 minutes.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

# Allow the workflow to commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: sit-housing-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new housing
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          CITY: ${{ vars.CITY || 'Trondheim' }}
        run: python check_sit_housing.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "Update housing state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
